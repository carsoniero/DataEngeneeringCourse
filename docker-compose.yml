services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  
  init-db:
      image: postgres:15
      depends_on:
        db:
          condition: service_healthy
      env_file: .env
      volumes:
        - ./init/init.sql:/init.sql:ro    # ← слева именно файл
      entrypoint: ["/bin/sh", "-c"]
      command:
        - |
          PGPASSWORD="$$POSTGRES_PASSWORD" psql \
            -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 \
            -f /init.sql
      restart: "no"